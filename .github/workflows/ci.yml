name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install -r webapp/backend/requirements.txt
          pip install matchms pyteomics psims
      - name: Check core search
        run: python phyto_discover_core/core_search.py --db_path data/plant_library.db --mzml_file data/small.pwiz.1.1.mzML --compound_name Quercetin
      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: cd webapp/frontend && npm ci
      - run: cd webapp/frontend && npm run build